<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Diagonal Photo Ribbon — Motion-Style Demo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --text: #fff;
    --text-muted: #888;
    --accent: #d4a853;
    --grid-color: rgba(255,255,255,0.04);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Playfair Display', Georgia, serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    cursor: default;
  }

  /* ── Perspective Grid Background ── */
  .grid-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-size: 60px 60px;
    background-image:
      linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
    transform: perspective(600px) rotateX(15deg) scale(1.5);
    transform-origin: center 70%;
    opacity: 0.6;
  }

  /* ── Content overlay (text, CTA) ── */
  .content {
    position: fixed;
    bottom: 60px;
    left: 60px;
    z-index: 20;
    pointer-events: none;
  }
  .content .label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .content .label::before {
    content: '';
    display: block;
    width: 30px;
    height: 1px;
    background: var(--text-muted);
  }
  .content h1 {
    font-size: clamp(36px, 5vw, 72px);
    font-weight: 400;
    line-height: 1.1;
    margin-bottom: 20px;
  }
  .content h1 em {
    font-style: italic;
    color: var(--accent);
  }
  .content p {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    color: var(--text-muted);
    max-width: 400px;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .content .cta {
    pointer-events: all;
    display: inline-block;
    padding: 12px 28px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 30px;
    color: var(--text);
    text-decoration: none;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    transition: all 0.3s ease;
    cursor: pointer;
  }
  .content .cta:hover {
    background: var(--text);
    color: var(--bg);
  }

  /* ── Ribbon Container ── */
  .ribbon-container {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
  }

  /* ── Individual Photo Card ── */
  .photo-card {
    position: absolute;
    pointer-events: all;
    cursor: pointer;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    transition: box-shadow 0.4s ease;
    will-change: transform, width, height;
  }
  .photo-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }
  .photo-card:hover {
    box-shadow: 0 16px 64px rgba(0,0,0,0.7);
  }
  .photo-card .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.4) 0%, transparent 50%);
    opacity: 0;
    transition: opacity 0.3s ease;
    display: flex;
    align-items: flex-end;
    padding: 12px;
  }
  .photo-card:hover .overlay {
    opacity: 1;
  }
  .photo-card .overlay span {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px;
    color: #fff;
    letter-spacing: 1px;
  }

  /* ── Lightbox ── */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .lightbox.active {
    opacity: 1;
    pointer-events: all;
  }
  .lightbox img {
    max-width: 85vw;
    max-height: 85vh;
    border-radius: 8px;
    object-fit: contain;
    box-shadow: 0 20px 80px rgba(0,0,0,0.6);
  }
  .lightbox .close-btn {
    position: absolute;
    top: 30px;
    right: 30px;
    width: 40px;
    height: 40px;
    border: none;
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 20px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .lightbox .close-btn:hover { background: rgba(255,255,255,0.2); }

  .lightbox .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border: none;
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 22px;
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.2s;
  }
  .lightbox .nav-btn:hover { background: rgba(255,255,255,0.15); }
  .lightbox .nav-btn.prev { left: 30px; }
  .lightbox .nav-btn.next { right: 30px; }

  /* ── Nav ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 40px;
    gap: 24px;
  }
  nav .logo {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  nav a {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.2s;
  }
  nav a:hover { color: var(--text); }

  /* ── Theme toggle ── */
  .theme-toggle {
    position: fixed;
    top: 24px;
    right: 40px;
    z-index: 50;
    width: 48px;
    height: 26px;
    border-radius: 13px;
    background: rgba(255,255,255,0.15);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    padding: 3px;
    transition: background 0.3s;
  }
  .theme-toggle .knob {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
  }
  body.light .theme-toggle .knob { transform: translateX(22px); }

  /* ── Light theme ── */
  body.light {
    --bg: #f5f5f0;
    --text: #111;
    --text-muted: #777;
    --grid-color: rgba(0,0,0,0.04);
  }
  body.light .photo-card {
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }
  body.light .content .cta {
    border-color: rgba(0,0,0,0.3);
    color: var(--text);
  }
  body.light .content .cta:hover {
    background: var(--text);
    color: var(--bg);
  }
</style>
</head>
<body>

<div class="grid-bg"></div>

<nav>
  <span class="logo">Motion</span>
  <a href="#">Gallery</a>
  <a href="#">Pricing</a>
</nav>

<button class="theme-toggle" onclick="document.body.classList.toggle('light')">
  <div class="knob">●</div>
</button>

<div class="ribbon-container" id="ribbon"></div>

<div class="content">
  <div class="label">Selected Work · 2014 — 2026</div>
  <h1>Every frame,<br><em>every story.</em></h1>
  <p>Twelve years of editorial, fashion, and brand photography — one infinite reel. Hover to feel it; click to see it full.</p>
  <a class="cta" href="#">Book a session →</a>
</div>

<div class="lightbox" id="lightbox">
  <button class="close-btn" onclick="closeLightbox()">✕</button>
  <button class="nav-btn prev" onclick="navLightbox(-1)">‹</button>
  <img id="lightbox-img" src="" alt="">
  <button class="nav-btn next" onclick="navLightbox(1)">›</button>
</div>

<script>
// ─────────────────────────────────────────────
// CONFIG — tweak these to adjust the effect
// ─────────────────────────────────────────────
const CONFIG = {
  totalCards: 40,          // number of photos in the ribbon
  baseSize: 60,            // smallest card size (px) — at the edges
  maxSize: 220,            // largest card size (px) — near center/hover
  speed: 0.4,              // auto-scroll speed (px per frame)
  hoverRadius: 350,        // pixel radius for mouse proximity effect
  hoverScale: 2.5,         // max scale multiplier on hover
  diagonalAngle: 32,       // angle of the ribbon diagonal (degrees)
  cardSpacing: 130,        // spacing between card centers along the path
  rotationRange: 8,        // max random rotation (degrees) per card
  perspectiveDepth: 800,   // CSS perspective value
};

// ─────────────────────────────────────────────
// PHOTO SOURCES (using picsum for demo — replace with your own)
// ─────────────────────────────────────────────
const photos = Array.from({ length: CONFIG.totalCards }, (_, i) => ({
  src: `https://picsum.photos/seed/motion${i}/400/500`,
  label: `Project ${i + 1}`,
  url: `#project-${i + 1}`,       // ← link to each "website"
}));

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;
let scrollOffset = 0;
let cards = [];
let lightboxIndex = -1;
let isPaused = false;

// ─────────────────────────────────────────────
// CREATE CARDS
// ─────────────────────────────────────────────
const ribbon = document.getElementById('ribbon');

photos.forEach((photo, i) => {
  const card = document.createElement('div');
  card.className = 'photo-card';
  card.innerHTML = `
    <img src="${photo.src}" alt="${photo.label}" loading="lazy">
    <div class="overlay"><span>${photo.label}</span></div>
  `;
  card.addEventListener('click', () => openLightbox(i));
  ribbon.appendChild(card);

  cards.push({
    el: card,
    index: i,
    baseRotation: (Math.random() - 0.5) * CONFIG.rotationRange * 2,
    pathOffset: i * CONFIG.cardSpacing,
  });
});

// ─────────────────────────────────────────────
// DIAGONAL PATH — maps a 1D offset to 2D position
// ─────────────────────────────────────────────
const angleRad = (CONFIG.diagonalAngle * Math.PI) / 180;
const pathDirX = Math.cos(angleRad);
const pathDirY = Math.sin(angleRad);

// Total path length for wrapping
const totalPathLength = CONFIG.totalCards * CONFIG.cardSpacing;

function getPositionOnPath(offset) {
  // Wrap offset to create infinite loop
  let t = ((offset % totalPathLength) + totalPathLength) % totalPathLength;
  // Center the path on screen
  const centerX = window.innerWidth * 0.5;
  const centerY = window.innerHeight * 0.45;
  // Map to diagonal
  const halfPath = totalPathLength / 2;
  const relativeT = t - halfPath;
  return {
    x: centerX + relativeT * pathDirX,
    y: centerY + relativeT * pathDirY,
  };
}

// ─────────────────────────────────────────────
// DEPTH SCALING — cards near center are bigger
// ─────────────────────────────────────────────
function getDepthScale(x, y) {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  const dist = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
  const maxDist = Math.sqrt(cx ** 2 + cy ** 2);
  const normalizedDist = Math.min(dist / maxDist, 1);
  // Ease: closer to center = bigger
  return 1 - normalizedDist * 0.7;
}

// ─────────────────────────────────────────────
// MOUSE PROXIMITY SCALING
// ─────────────────────────────────────────────
function getMouseScale(x, y) {
  const dist = Math.sqrt((x - mouseX) ** 2 + (y - mouseY) ** 2);
  if (dist > CONFIG.hoverRadius) return 1;
  const t = 1 - dist / CONFIG.hoverRadius;
  // Smooth ease-out
  return 1 + (CONFIG.hoverScale - 1) * (t * t);
}

// ─────────────────────────────────────────────
// ANIMATION LOOP
// ─────────────────────────────────────────────
function animate() {
  if (!isPaused) {
    scrollOffset += CONFIG.speed;
  }

  cards.forEach((card) => {
    const pos = getPositionOnPath(card.pathOffset + scrollOffset);
    const depthScale = getDepthScale(pos.x, pos.y);
    const mouseScale = getMouseScale(pos.x, pos.y);
    const finalScale = depthScale * mouseScale;

    const size = CONFIG.baseSize + (CONFIG.maxSize - CONFIG.baseSize) * depthScale;
    const w = size * mouseScale;
    const h = size * 1.25 * mouseScale; // slight portrait aspect ratio

    // Z-depth for layering (closer to center = higher z-index)
    const zIndex = Math.round(finalScale * 100);

    // 3D tilt based on mouse proximity
    const dx = pos.x - mouseX;
    const dy = pos.y - mouseY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    let tiltX = 0, tiltY = 0;
    if (dist < CONFIG.hoverRadius && dist > 0) {
      const intensity = (1 - dist / CONFIG.hoverRadius) * 15;
      tiltX = (dy / dist) * intensity;
      tiltY = -(dx / dist) * intensity;
    }

    card.el.style.width = `${w}px`;
    card.el.style.height = `${h}px`;
    card.el.style.left = `${pos.x - w / 2}px`;
    card.el.style.top = `${pos.y - h / 2}px`;
    card.el.style.zIndex = zIndex;
    card.el.style.transform = `
      perspective(${CONFIG.perspectiveDepth}px)
      rotateX(${tiltX}deg)
      rotateY(${tiltY}deg)
      rotateZ(${card.baseRotation}deg)
    `;
    card.el.style.opacity = Math.max(0.15, depthScale);
  });

  requestAnimationFrame(animate);
}

// ─────────────────────────────────────────────
// MOUSE TRACKING
// ─────────────────────────────────────────────
document.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

// ─────────────────────────────────────────────
// LIGHTBOX
// ─────────────────────────────────────────────
function openLightbox(index) {
  lightboxIndex = index;
  isPaused = true;
  const lb = document.getElementById('lightbox');
  document.getElementById('lightbox-img').src = photos[index].src;
  lb.classList.add('active');
}

function closeLightbox() {
  isPaused = false;
  document.getElementById('lightbox').classList.remove('active');
  lightboxIndex = -1;
}

function navLightbox(dir) {
  lightboxIndex = ((lightboxIndex + dir) % photos.length + photos.length) % photos.length;
  document.getElementById('lightbox-img').src = photos[lightboxIndex].src;
}

document.addEventListener('keydown', (e) => {
  if (lightboxIndex === -1) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') navLightbox(1);
  if (e.key === 'ArrowLeft') navLightbox(-1);
});

// ─────────────────────────────────────────────
// START
// ─────────────────────────────────────────────
animate();
</script>
</body>
</html>
